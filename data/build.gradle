//file:noinspection GrUnresolvedAccess
plugins {
    id 'com.android.library'
    id 'kotlin-android'
    id 'kotlin-kapt'
}

android {
    compileSdkVersion rootProject.compile_sdk_version
    //noinspection GroovyAssignabilityCheck

    //noinspection GroovyAssignabilityCheck
    defaultConfig {
        minSdkVersion rootProject.min_sdk_version

        buildConfigField "String", "HOST_URL", "\"${rootProject.HOST_URL}\""
        buildConfigField "String", "DATABASE_NAME", "\"${rootProject.DATABASE_NAME}\""

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles 'consumer-rules.pro'
    }

    buildFeatures {
        buildConfig = true
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),
                    'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    packagingOptions {
        resources.excludes.add("META-INF/*")
    }
    namespace 'ua.turskyi.data'
    testOptions {
        targetSdk 37
    }
    lint {
        targetSdk 37
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])

    /* data module knows only about the domain layer, a layer with interfaces which communicates
    with another presentation, outer (top) level of the project */
    implementation project(':domain')

    // kotlin
    api libs.kotlin.reflect

    // Koin for Android
    api libs.koin.android
    // Koin core features
    api libs.koin.core

    // network
    api libs.okhttp
    api libs.retrofit
    api libs.converter.gson
    api libs.gson
    api libs.java.jwt

    // database
    api libs.room.runtime
    api libs.room.ktx
    //noinspection KaptUsageInsteadOfKsp
    kapt libs.room.compiler

    // test
    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core

    // testImplementation for pure JVM unit tests
    testImplementation libs.kotlinx.coroutines.test

    // androidTestImplementation for Android instrumentation tests
    androidTestImplementation libs.kotlinx.coroutines.test
}
