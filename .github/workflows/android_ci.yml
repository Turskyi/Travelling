name: Upload to Firebase App Distribution

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches-ignore:
      - master

jobs:
  build:
    name: Build Travelling Android mobile app
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v2.3.3

      - name: Set up JDK environment(JDK 17)
        uses: actions/setup-java@v1.4.3
        with:
          java-version: 17

      - name: Run Regression Unit Tests
        run: ./gradlew test

      - name: Set up Keystore
        run: |
          mkdir -p keystore
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > keystore/travelling.jks

      - name: Generate Release APK
        run: ./gradlew assembleRelease
        env:
          SIGNING_KEY_RELEASE_PASSWORD: ${{ secrets.SIGNING_KEY_RELEASE_PASSWORD }}
          SIGNING_KEY_RELEASE_KEY: ${{ secrets.SIGNING_KEY_RELEASE_KEY }}
          SIGNING_KEY_RELEASE_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_RELEASE_KEY_PASSWORD }}

      - name: upload artifact to Firebase App Distribution
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{secrets.FIREBASE_ANDROID_APPID}}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          groups: testers
          releaseNotes: "Travelling Android App Build"
          file: presentation/build/outputs/apk/release/presentation-release.apk
